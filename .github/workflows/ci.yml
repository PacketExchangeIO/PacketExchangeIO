name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            *.md
            .github/**/*.md
